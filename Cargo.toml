[package]
name = "wslc-runtime"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
repository = "https://github.com/uni-kakurenbo/wslc-runtime"
description = "Owned WSLC sessions, verified SDK caching and scoped process execution"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_Networking_WinHttp", "Win32_System_Console", "Win32_Storage_FileSystem"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
